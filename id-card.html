<!DOCTYPE html>
<html lang="hi">
<head>
  <link rel="icon" type="image/jpeg" href="SNT.jpg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNT Premium ID Card</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');
    
    :root { 
      --snt-dark: #000428; 
      --snt-orange: #ff5722;
      --snt-gold: #ff9800;
      --snt-gradient-main: linear-gradient(135deg, #ff5722, #ff9800);
      --snt-gradient-header: linear-gradient(135deg, #000428, #002244);
    }

    body { font-family: 'Poppins', sans-serif; background: #cbd5e1; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }

    /* Control Panel */
    .no-print { background: #fff; padding: 20px; border-radius: 14px; margin-bottom: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); width: 380px; text-align: center; border: 2px solid #ff9800; }
    .no-print input { width: 80%; padding: 12px; border: 2px solid #cbd5e1; border-radius: 8px; margin-bottom: 12px; outline: none; font-size: 14px; font-weight: 600; }
    .no-print input:focus { border-color: var(--snt-orange); }
    .btn-panel { display: flex; justify-content: center; gap: 10px; }
    .no-print button { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; font-size: 13px; }
    .btn-gen { background: var(--snt-gradient-main); }
    .btn-switch { background: var(--snt-dark); }

    /* --- ID CARD FRONT - HIGH VISUAL CHANGES --- */
    .id-card-front { 
      width: 335px; height: 530px; 
      background: #ffffff; border-radius: 20px; 
      position: relative; overflow: hidden; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
      border: 3px solid #ff9800; /* Clear Orange Border */
      display: none; transition: 0.3s;
    }

    /* Top Header Box with Orange Glow Accent */
    .header-box { 
      height: 120px; 
      background: var(--snt-gradient-header); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      clip-path: polygon(0 0, 100% 0, 100% 82%, 0 100%); 
      position: relative;
      border-bottom: 4px solid var(--snt-orange); /* Bold Orange Line */
    }
    .header-box img { width: 160px; height: auto; object-fit: contain; filter: drop-shadow(0 2px 5px rgba(255,255,255,0.3)); }

    /* Student Photo with Thick Orange Frame */
    .photo-wrap { margin-top: -55px; display: flex; justify-content: center; position: relative; z-index: 5; }
    .student-photo { 
      width: 110px; height: 130px; 
      border: 4px solid #ff9800; 
      border-radius: 14px; 
      object-fit: cover; 
      box-shadow: 0 8px 20px rgba(255,152,0,0.4); 
      background: white; 
    }

    /* Name & Course Badge */
    .name-card { text-align: center; margin-top: 6px; padding: 0 10px; }
    .name-card h2 { margin: 0; color: var(--snt-dark); font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; }
    .course-tag { 
      display: inline-block; 
      background: var(--snt-gradient-main); 
      color: #ffffff; 
      padding: 4px 14px; 
      border-radius: 20px; 
      font-size: 11px; 
      font-weight: 800; 
      margin-top: 6px; 
      box-shadow: 0 4px 10px rgba(255,87,34,0.3);
      max-width: 90%; 
      word-wrap: break-word; 
    }

    /* Information Fields */
    .info-container { padding: 8px 20px; }
    .info-item { display: flex; margin-bottom: 6px; border-bottom: 1.5px solid #ffe0b2; padding-bottom: 3px; align-items: flex-start; }
    .info-label { font-size: 10px; color: #e65100; width: 36%; font-weight: 800; text-transform: uppercase; }
    .info-val { font-size: 11.5px; color: #000428; width: 64%; font-weight: 800; text-align: right; line-height: 1.2; word-wrap: break-word; }

    /* Footer / QR & Signature */
    .footer-action { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; position: absolute; bottom: 50px; width: 295px; }
    
    .qr-holder { 
      background: white; 
      padding: 5px; 
      border: 2px solid var(--snt-orange); 
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    
    .sign-box { text-align: center; font-size: 9px; color: #000428; width: 105px; font-weight: 700; }
    .sign-box div { border-bottom: 2px solid #000428; height: 22px; margin-bottom: 3px; }

    /* Bottom Orange Banner */
    .bottom-identity { 
      position: absolute; 
      bottom: 0; 
      width: 100%; 
      height: 42px; 
      background: var(--snt-gradient-main); 
      color: white; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      border-top: 2px solid #fff;
    }
    .bottom-identity b { font-size: 11px; letter-spacing: 1px; font-weight: 900; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); }

    /* Landscape Mode */
    .id-card-front.landscape { width: 530px !important; height: 335px !important; }
    .landscape .header-box { height: 62px; clip-path: none; border-bottom: 3px solid var(--snt-orange); }
    .landscape .photo-wrap { position: absolute; top: 78px; left: 20px; margin: 0; }
    .landscape .name-card { position: absolute; top: 74px; left: 140px; text-align: left; padding: 0; width: 360px; }
    .landscape .info-container { position: absolute; top: 122px; left: 140px; width: 365px; padding: 0; }
    .landscape .footer-action { position: absolute; bottom: 48px; right: 20px; left: auto; width: auto; gap: 28px; }

    @media print {
      .no-print { display: none; }
      body { background: white; padding: 0; }
      .id-card-front { display: block !important; box-shadow: none; border: 2px solid #ff9800; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <h3 style="margin-top:0; color: #000428;">SNT Professional ID Card</h3>
    <input type="text" id="id-input" placeholder="Enter Roll No (e.g. SNT-101)">
    <div class="btn-panel">
        <button class="btn-gen" onclick="generateCard()">Generate Card</button>
        <button class="btn-switch" onclick="toggleOrientation()">Switch View 🔄</button>
        <button class="btn-print" onclick="window.print()" style="background:#2e7d32">Print PDF</button>
    </div>
  </div>

  <div id="id-card" class="id-card-front">
    <div class="header-box"><img src="Logo (1).jpg" alt="Logo"></div>
    <div class="photo-wrap"><img id="d-photo" src="" class="student-photo" alt="Photo"></div>

    <div class="name-card">
      <h2 id="d-name">STUDENT NAME</h2>
      <div id="d-course" class="course-tag">COURSE NAME</div>
    </div>

    <div class="info-container">
      <div class="info-item"><span class="info-label">Roll No</span><span id="d-id" class="info-val">-</span></div>
      <div class="info-item"><span class="info-label">Father's Name</span><span id="d-father" class="info-val">-</span></div>
      <div class="info-item"><span class="info-label">D.O.B</span><span id="d-dob" class="info-val">-</span></div>
      <div class="info-item"><span class="info-label">Contact</span><span id="d-mobile" class="info-val">-</span></div>
      <div class="info-item" style="border:none;"><span class="info-label">Address</span><span id="d-address" class="info-val">-</span></div>
    </div>

    <div class="footer-action">
        <div class="qr-holder" id="qrcode"></div>
        <div class="sign-box"><div></div><b>Director Sign</b></div>
    </div>

    <div class="bottom-identity">
      <b>SNT COMPUTER INSTITUTE</b>
      <span style="font-size: 7.5px; font-weight: 700; letter-spacing: 0.5px;">Quality Education & Digital Verification</span>
    </div>
  </div>

  <script>
    const firebaseConfig = { 
        apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA", 
        authDomain: "snt-computer-institute.firebaseapp.com", 
        databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com/", 
        projectId: "snt-computer-institute", 
        storageBucket: "snt-computer-institute.firebasestorage.app", 
        messagingSenderId: "117580784781", 
        appId: "1:117580784781:web:73ba19d2d008beb3a5eec4" 
    };
    firebase.initializeApp(firebaseConfig);

    function toggleOrientation() {
        document.getElementById('id-card').classList.toggle('landscape');
    }

    function generateCard() {
      const sid = document.getElementById('id-input').value.trim();
      if(!sid) return alert("Please enter Roll No");

      firebase.database().ref('students').orderByChild('studentId').equalTo(sid).once('value', snap => {
        if(snap.exists()){
          const u = Object.values(snap.val())[0];

          let studentCourse = u.course || (u.courses ? (Array.isArray(u.courses) ? u.courses[0] : u.courses) : "N/A");

          document.getElementById('d-name').innerText = u.name || 'N/A';
          document.getElementById('d-id').innerText = u.studentId || '-';
          document.getElementById('d-course').innerText = studentCourse; 
          document.getElementById('d-father').innerText = u.fatherName || '-';
          document.getElementById('d-dob').innerText = u.dob || '-';
          document.getElementById('d-mobile').innerText = u.mobile || u.phone || '-';
          document.getElementById('d-address').innerText = u.address || 'Rudauli-Ayodhya, UP';
          document.getElementById('d-photo').src = u.profilePicture || 'https://via.placeholder.com/110x130';
          
          const vLink = `https://harshitkaushal9129-bit.github.io/snt-institute/id-verify.html?id=${u.studentId}`;
          
          document.getElementById('qrcode').innerHTML = "";
          new QRCode(document.getElementById('qrcode'), { 
            text: vLink, 
            width: 72, 
            height: 72, 
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H 
          });

          document.getElementById('id-card').style.display = 'block';
        } else { alert("Student Data Not Found!"); }
      });
    }
  </script>
</body>
</html>
